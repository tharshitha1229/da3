spring.application.name=airline-system

# Cloud Neo4j Database Connection
# Configurable via environment variables (NEO4J_URI, NEO4J_USERNAME, NEO4J_PASSWORD, NEO4J_DATABASE)
spring.neo4j.uri=${NEO4J_URI:${SPRING_NEO4J_URI:neo4j+s://dce79b02.databases.neo4j.io}}
spring.neo4j.authentication.username=${NEO4J_USERNAME:${SPRING_NEO4J_AUTHENTICATION_USERNAME:dce79b02}}
spring.neo4j.authentication.password=${NEO4J_PASSWORD:${SPRING_NEO4J_AUTHENTICATION_PASSWORD:vX80rrSRQs8_FEmpfoX5Z4OumMiITAG3mq3QsQ9g_sQ}}
spring.neo4j.database=${NEO4J_DATABASE:${SPRING_NEO4J_DATABASE:dce79b02}}

# Server Configuration
server.port=${PORT:8080}
server.address=${SERVER_ADDRESS:0.0.0.0}

# Driver Connection Timeout configuration
spring.neo4j.connection-timeout=5s
